<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dienst">
  <meta name="format-detection" content="telephone=no">
  <title>Dienst</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">

<style>
.entry-rounded-hours{
  display:block;
  margin-top:4px;
  font-size:13px;
  line-height:1.2;
  font-weight:600;
  color:#6b7280;
  white-space:nowrap;
}
</style>

</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <button id="homeButton" class="brand-icon" type="button" aria-label="Zum aktuellen Bereitschaftsdienst">🚑</button>
        <div>
          <h1 id="pageTitle">Dienst</h1>
          <div id="pageSubtitle" class="page-subtitle">Bereitschaft erfassen</div>
        </div>
      </div>
      <button id="menuButton" class="circle-button" type="button" aria-label="Mehr Optionen">•••</button>
    </header>

    <div id="updateBanner" class="notice update-notice" hidden>
      <span>Eine neue Version ist verfügbar.</span>
      <button id="updateButton" type="button">Aktualisieren</button>
    </div>

    <div id="backupReminder" class="notice backup-notice" hidden>
      <span>Bitte eine lokale Sicherung erstellen.</span>
      <div class="backup-notice-actions">
        <button id="backupReminderButton" type="button">Sichern</button>
        <button id="backupReminderDismiss" class="notice-dismiss" type="button" aria-label="Erinnerung schließen">×</button>
      </div>
    </div>

    <main id="mainContent"></main>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <button class="tab active" data-view="dienst" type="button">
        <span class="tab-icon" aria-hidden="true">◷</span><span>Dienst</span>
      </button>
      <button class="tab" data-view="monat" type="button">
        <span class="tab-icon" aria-hidden="true">▦</span><span>Übersicht</span>
      </button>
    </nav>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <div id="undoToast" class="undo-toast" hidden><span id="undoToastText">Gelöscht</span><button id="undoToastButton" type="button">Rückgängig</button></div>

  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <script src="app.js" defer></script>
</body>
</html>
